name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            requirements-test.txt
      - name: Verify release tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) { throw "Tag $env:GITHUB_REF_NAME does not match VERSION ($expectedTag)." }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build app and installer
        shell: pwsh
        run: .\Build_Windows_Installer.bat
      - name: Verify installer output
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path "dist-installer" -Filter "PAI-AI-Image-Studio-Setup-*.exe" -File | Select-Object -First 1
          if (-not $setup) { throw "No installer EXE was produced." }
          Get-FileHash -Algorithm SHA256 $setup.FullName | Format-List
      - name: Upload setup artifact
        uses: actions/upload-artifact@v7
        with:
          name: PAI-AI-Image-Studio-Windows-Setup
          path: dist-installer/PAI-AI-Image-Studio-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release asset for version tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: P.AI AI Image Studio ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: dist-installer/PAI-AI-Image-Studio-Setup-*.exe
