changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - dependabot[bot]
  categories:
    - title: "New features"
      labels:
        - enhancement
    - title: "Bug fixes"
      labels:
        - bug
    - title: "Documentation and maintenance"
      labels:
        - documentation
        - maintenance
    - title: "Other changes"
      labels:
        - "*"
