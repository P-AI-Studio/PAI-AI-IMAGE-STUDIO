name: Bug report
description: Report a reproducible app, model, installer, or workflow issue.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not upload private photos, model weights, credentials, access tokens, or unredacted logs. Remove usernames and private paths before sharing diagnostic output.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 1.0.0-beta.1
    validations:
      required: true
  - type: dropdown
    id: workflow
    attributes:
      label: Workflow or area
      options:
        - Image Generate
        - Image Edit
        - Enhance / Upscale
        - Close-up / Smart Zoom
        - Square 1:1
        - Real-ESRGAN / Real-ESRNet
        - Model Catalog / Runtime
        - Installation / Update
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows build, Python version for source mode, GPU, VRAM, driver, runtime revision, and model roles.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: 1. Open the app. 2. Select... 3. Run...
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted log excerpt
    validations:
      required: false
